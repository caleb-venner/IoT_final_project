; Smart Irrigation with Edge-ML Wilt Detection
; One PlatformIO project, one env per firmware. Build/flash with e.g.:
;   pio run -e camera -t upload
;   pio run -e watering -t upload && pio device monitor
;
; Shared headers (plant_msgs.h, secrets.h) live in include/.
; Each firmware's sources live in src/<name>/ and are selected with build_src_filter.

[platformio]
default_envs = camera, watering

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ---------- Camera board: Freenove ESP32-WROVER CAM ----------
[camera_board]
board = esp-wrover-kit
board_build.partitions = huge_app.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

; Camera node firmware. OWNER: Aida (Caleb: espnow_tx)
[env:camera]
extends = camera_board
build_src_filter = +<camera/>

; Camera node sending fake healthy/wilted results (no camera or model needed)
[env:camera-mock]
extends = env:camera
build_flags =
  ${camera_board.build_flags}
  -DMOCK_HEALTH

; Training data collection: timed JPEGs to SD card. OWNER: Aida
[env:capture]
extends = camera_board
build_src_filter = +<capture/>

; ---------- Watering board: ESP32 DevKitC ----------
; Watering node firmware. OWNER: Caleb
[env:watering]
board = esp32dev
build_src_filter = +<watering/>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7

; Watering node with a simulated moisture curve (no sensor needed)
[env:watering-mock]
extends = env:watering
build_flags =
  -DMOCK_SENSORS
