; Smart Irrigation with Edge-ML Wilt Detection
; One PlatformIO project, one env per firmware. Build/flash with e.g.:
;   pio run -e camera -t upload
;   pio run -e watering -t upload && pio device monitor
;
; Shared headers (plant_msgs.h, secrets.h) live in include/.
; Each firmware's sources live in src/<name>/ and are selected with build_src_filter.

[platformio]
default_envs = camera, watering

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ---------- Camera board: Freenove ESP32-WROVER CAM ----------
[camera_board]
board = esp-wrover-kit
board_build.partitions = min_spiffs.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

; Camera node firmware. OWNER: Caleb
[env:camera]
extends = camera_board
build_src_filter = +<camera/>

; Training data collection: timed JPEGs to SD card + HTTP sync server. OWNER: Caleb
[env:capture]
extends = camera_board
build_src_filter = +<capture/>

; ---------- Watering board: ESP32 DevKitC ----------
; Watering node firmware. OWNER: Caleb
[env:watering]
board = esp32dev
build_src_filter = +<watering/>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
