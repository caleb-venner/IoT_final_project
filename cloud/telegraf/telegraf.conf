# telegraf.conf
# Purpose: MQTT -> InfluxDB bridge for the smart irrigation project.
# OWNER:   Aida
#
# Secrets and connection details come from environment variables (see cloud/.env):
#   ${MQTT_HOST} ${MQTT_PORT} ${MQTT_USER} ${MQTT_PASS}
#   ${INFLUX_URL} ${INFLUX_TOKEN} ${INFLUX_ORG} ${INFLUX_BUCKET}
#
# Topics and payloads (single source of truth: include/plant_msgs.h):
#   farm/basil_aida_caleb/telemetry  {"moisture_pct":41.5,"moisture_raw":2310,"pump":0,
#                           "health_state":"healthy","health_conf":0.91,
#                           "health_age_s":12,"water_ml_total":180}   every 10 s
#   farm/basil_aida_caleb/events     {"event":"pump_run","reason":"dry+wilted",
#                           "duration_ms":4000,"ml":25}               on each watering
#   farm/basil_aida_caleb/status     online | offline  (retained, last will)   on connect/disconnect

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# =====================================================================
# Input 1: telemetry  ->  measurement "telemetry"
# =====================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["farm/basil_aida_caleb/telemetry"]
  qos = 0
  client_id = "telegraf-basil-telemetry"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      # Keep the plant device as a tag so multiple plants can share a bucket.
      tags = ["health_state"]
      # Everything else is a numeric field; health_state is carried as a tag above.
      [inputs.mqtt_consumer.json_v2.object.fields]
        moisture_pct   = "float"
        moisture_raw   = "int"
        pump           = "int"
        health_conf    = "float"
        health_age_s   = "int"
        water_ml_total = "float"

  # Tag every point from this broker with the plant id parsed from the topic.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic    = "farm/+/telemetry"
    tags     = "_/plant/_"

# =====================================================================
# Input 2: events  ->  measurement "events"
# =====================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["farm/basil_aida_caleb/events"]
  qos = 0
  client_id = "telegraf-basil-events"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "events"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["event", "reason"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        duration_ms = "int"
        ml          = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic    = "farm/+/events"
    tags     = "_/plant/_"

# =====================================================================
# Input 3: status  ->  measurement "status"
# Plain-string retained payload: "online" / "offline".
# Map it to a numeric field (online=1, offline=0) via a processor below.
# =====================================================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["farm/basil_aida_caleb/status"]
  qos = 1
  client_id = "telegraf-basil-status"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"

  data_format = "value"
  data_type = "string"
  name_override = "status"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic    = "farm/+/status"
    tags     = "_/plant/_"

# Turn the "value" string field ("online"/"offline") into a numeric "online" field.
[[processors.enum]]
  namepass = ["status"]
  [[processors.enum.mapping]]
    field = "value"
    dest  = "online"
    [processors.enum.mapping.value_mappings]
      online  = 1
      offline = 0

# =====================================================================
# Output: InfluxDB v2
# =====================================================================
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

  # Drop the leftover raw string field from status points; keep numeric "online".
  fielddrop = ["value"]
