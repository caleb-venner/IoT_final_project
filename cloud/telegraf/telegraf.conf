# telegraf.conf
# Purpose: MQTT -> InfluxDB bridge for the smart irrigation project.
# OWNER:   Aida
# Runs on: TODO(Aida) (see cloud/README.md)
#
# TEMPLATE ONLY. Every value marked TODO(Aida) must be filled in.
# Secrets come from environment variables: ${INFLUX_TOKEN}, ${MQTT_USER}, ${MQTT_PASS}.

[agent]
  interval = "10s"
  flush_interval = "10s"

# ---------- Input: MQTT ----------
[[inputs.mqtt_consumer]]
  servers = ["ssl://broker.example.com:8883"]   # TODO(Aida)
  topics = [
    "farm/basil1/telemetry",
    "farm/basil1/events",
  ]
  qos = 0
  client_id = "telegraf-basil"                   # TODO(Aida)
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  # insecure_skip_verify = false                 # TODO(Aida): TLS settings

  data_format = "json"
  # TODO(Aida): which JSON keys become tags vs fields.
  # tag_keys = []
  # String fields to keep (otherwise Telegraf drops non-numeric values):
  # json_string_fields = ["health_state", "event", "reason"]

  # TODO(Aida): consider splitting telemetry/events into separate measurements, e.g. with
  # [[inputs.mqtt_consumer.topic_parsing]] or a name_override per input block.

# ---------- Output: InfluxDB v2 ----------
[[outputs.influxdb_v2]]
  urls = ["https://influx.example.com"]          # TODO(Aida)
  token = "${INFLUX_TOKEN}"
  organization = "your-org"                      # TODO(Aida)
  bucket = "basil"                               # TODO(Aida)
